<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Native video preview HTTP checks</title><style>body{font:16px/1.5 system-ui;max-width:1100px;margin:40px auto;padding:20px;background:#f5f3ee;color:#0a0a0a}button{padding:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>Native video HTTP checks</h1><p>Preview-only QA. Checks same-origin MP4 headers and the first and last 1,024 bytes using this browser's existing preview access. No credentials are displayed or stored. Does not submit enquiries.</p><button id="run">Run HTTP range checks</button><pre id="results" role="status">Not run</pre><script>
const files=[{"key": "receiving", "path": "/assets/demos/receiving.mp4", "size": 536572, "prefixSha256": "a3ea37ef179a95f663b504f504b4e26999d3587f62ab67706f5a8379a9f6bf71", "suffixSha256": "f4f3eb4dba42469fd3b889d4bb694aefb720e5925eabfcf72bde0088023541e5"}, {"key": "putaway", "path": "/assets/demos/putaway.mp4", "size": 155538, "prefixSha256": "764e984b6c074bd13137393ebafe5d391512323582dfbe43dbd2a46132734bde", "suffixSha256": "a2e4c0619bb785cac3f3fcdbac0af884e18f9a25a7c74ae71176ca81b0d44a15"}, {"key": "inventory-counting", "path": "/assets/demos/inventory-counting.mp4", "size": 263986, "prefixSha256": "c6802567a8b2a0428e32565fce7e780b549ab0d15d053d7ef3f5d1f18c61ee8d", "suffixSha256": "bcf9101c98f6131e4e53cbcfa90a4c8bfc4f6f8040211829386151d5850cfaff"}, {"key": "replenishment", "path": "/assets/demos/replenishment.mp4", "size": 532356, "prefixSha256": "f3c0193af9180116774766d97215bdf1d5af34f2264558eeaef802394f3b84da", "suffixSha256": "e52bfa2be7bff6a1e644ed0182de0fe941c713ac26cb0e5f408352afbb9e15c8"}];
const sha=async b=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b))).map(x=>x.toString(16).padStart(2,'0')).join('');
document.querySelector('#run').addEventListener('click',async()=>{
 const output=document.querySelector('#results'),results=[];output.textContent='Running';
 for(const file of files){const start=performance.now();try{
 const head=await fetch(file.path,{method:'HEAD',credentials:'same-origin',cache:'no-store'});
 const first=await fetch(file.path,{headers:{Range:'bytes=0-1023'},credentials:'same-origin',cache:'no-store'}),firstBytes=await first.arrayBuffer();
 const tail=await fetch(file.path,{headers:{Range:'bytes=-1024'},credentials:'same-origin',cache:'no-store'}),tailBytes=await tail.arrayBuffer();
 const invalid=await fetch(file.path,{headers:{Range:'bytes='+file.size+'-'},credentials:'same-origin',cache:'no-store'});
 const row={key:file.key,headStatus:head.status,mime:head.headers.get('content-type'),length:head.headers.get('content-length'),acceptRanges:head.headers.get('accept-ranges'),rangeStatus:first.status,contentRange:first.headers.get('content-range'),rangeLength:firstBytes.byteLength,prefixMatches:await sha(firstBytes)===file.prefixSha256,suffixStatus:tail.status,suffixMatches:await sha(tailBytes)===file.suffixSha256,unsatisfiableStatus:invalid.status,elapsedMs:Math.round(performance.now()-start)};
 row.passed=row.headStatus===200&&row.mime?.startsWith('video/mp4')&&Number(row.length)===file.size&&row.rangeStatus===206&&row.contentRange==='bytes 0-1023/'+file.size&&row.rangeLength===1024&&row.prefixMatches&&row.suffixStatus===206&&row.suffixMatches&&row.unsatisfiableStatus===416;results.push(row);
 }catch(e){results.push({key:file.key,passed:false,error:e.message});}}
 output.textContent=JSON.stringify({passed:results.every(x=>x.passed),results},null,2);
});</script></html>
